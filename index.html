<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargando...</title>
  <style>
    html,body{height:100%;margin:0;display:grid;place-items:center;background:#111;color:#fff;font-family:system-ui}
    button{padding:1rem 1.5rem;font-size:1.2rem;border:0;border-radius:12px;cursor:pointer}
  </style>
</head>
<body>
  <button id="btn">Toca para continuar</button>
  <audio id="audio" src="gemidos.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('btn');

    async function reproducir() {
      try {
        await audio.play();
        btn.style.display = 'none';
      } catch (e) {
        btn.textContent = 'Toca otra vez';
      }
    }

    btn.addEventListener('click', reproducir);
  </script>
</body>
</html>
